# Keyless replay keeps the settings-backed composition intact and replaces only the model adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: settings
            name: '@deepseek-ai/dsh-settings-file'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'

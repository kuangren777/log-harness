# The smallest real composition that mounts the citation pool: the session
# store the tool records into, the tool registry and prompt assembly it joins,
# the JSON-backed storage domain its two tables live in, and the local
# filesystem the project tree — `refs.bib` and the manuscripts scanned for
# `\cite{}` — is actually read and written on. The literature layer is here so
# `citations_add` resolving a DOI goes through the real soft dependency rather
# than a stub. Both roots are per-run, so they come from the environment the
# suite sets before boot.
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_SCI_CITATIONS_TEST_ROOT
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_SCI_CITATIONS_TEST_SANDBOX
- name: '@deepseek-ai/dsh-sci-literature'
- name: '@deepseek-ai/dsh-sci-citations'
  config:
    projectRoot: !!js process.env.DSH_SCI_CITATIONS_TEST_SANDBOX + '/projects'
    maxCitations: 3
